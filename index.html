<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexora — Smart Products. Better Living.</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f6f7fb;color:#171923}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #e8e8ef}
.top{max-width:1100px;margin:auto;padding:14px 18px;display:flex;align-items:center;gap:16px}
.logo{font-size:25px;font-weight:800;color:#111}.logo span{font-weight:400}
.search{flex:1;position:relative}.search input{width:100%;padding:12px 16px;border:1px solid #ddd;border-radius:25px;font-size:15px;outline:none}
.cart{border:0;background:#111;color:#fff;border-radius:22px;padding:11px 15px;font-weight:700;cursor:pointer}
.hero{max-width:1100px;margin:18px auto;padding:34px 20px;border-radius:22px;background:linear-gradient(135deg,#111827,#334155);color:white}
.hero h1{font-size:38px;margin:0 0 8px}.hero p{margin:0 0 18px;color:#dbe3ef}.hero button{border:0;border-radius:22px;padding:12px 18px;font-weight:700;cursor:pointer}
.wrap{max-width:1100px;margin:auto;padding:0 18px 35px}.cats{display:flex;gap:9px;overflow:auto;padding:3px 0 16px}.cat{white-space:nowrap;border:1px solid #ddd;background:#fff;border-radius:20px;padding:9px 14px;cursor:pointer}.cat.active{background:#111;color:#fff;border-color:#111}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid #e9e9ef;border-radius:17px;overflow:hidden;box-shadow:0 2px 8px #00000008}.pic{height:155px;background:#eef0f5;display:flex;align-items:center;justify-content:center;font-size:58px}.info{padding:13px}.name{font-weight:700;min-height:38px}.price{font-size:18px;font-weight:800;margin:8px 0}.old{text-decoration:line-through;color:#999;font-size:13px;margin-left:5px}.add{width:100%;border:0;background:#111;color:#fff;padding:10px;border-radius:10px;font-weight:700;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20}.box{background:#fff;width:min(520px,92%);max-height:90vh;overflow:auto;margin:5vh auto;border-radius:20px;padding:20px}.close{float:right;border:0;background:#eee;border-radius:50%;width:32px;height:32px;cursor:pointer}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #eee}.checkout input{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px}.pay{width:100%;padding:13px;border:0;border-radius:11px;background:#111;color:#fff;font-weight:800;margin-top:10px;cursor:pointer}
.empty{text-align:center;padding:25px;color:#777}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:30px}.top{gap:9px}.logo{font-size:21px}.search input{padding:10px}.cart{padding:10px}}
@media(max-width:430px){.grid{gap:10px}.pic{height:130px;font-size:48px}.info{padding:10px}.name{font-size:14px}.price{font-size:16px}}
</style>
</head>
<body>
<header><div class="top">
  <div class="logo">Nexora<span>™</span></div>
  <div class="search"><input id="search" placeholder="Search products..." oninput="render()"></div>
  <button class="cart" onclick="openCart()">🛒 <span id="count">0</span></button>
</div></header>

<section class="hero">
  <h1>Smart Products. Better Living.</h1>
  <p>Discover useful products for your car, home, family and everyday life.</p>
  <button onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">Shop Now →</button>
</section>

<main class="wrap" id="products">
  <div class="cats" id="cats"></div>
  <div class="grid" id="grid"></div>
</main>

<div class="modal" id="modal"><div class="box">
  <button class="close" onclick="closeModal()">✕</button>
  <h2 id="modalTitle">Your Cart</h2>
  <div id="cartItems"></div>
  <div id="checkout" class="checkout" style="display:none">
    <h3>Checkout</h3>
    <input placeholder="Full name" id="name">
    <input placeholder="Mobile number" id="phone" inputmode="tel">
    <input placeholder="Delivery address" id="address">
    <p><b>Payment:</b> Online payment only — COD unavailable.</p>
    <button class="pay" onclick="demoPayment()">Proceed to Online Payment</button>
  </div>
  <div id="cartActions"></div>
</div></div>

<script>
const products=[
{id:1,n:"Magnetic Car Phone Holder",c:"Car & Auto",p:499,o:699,e:"🚗"},
{id:2,n:"Mini Wireless Bluetooth Speaker",c:"Tech & Gadgets",p:799,o:999,e:"🔊"},
{id:3,n:"LED Car Interior Light",c:"Car & Auto",p:349,o:499,e:"💡"},
{id:4,n:"Kids Educational Building Blocks",c:"Baby & Toys",p:599,o:799,e:"🧸"},
{id:5,n:"Rechargeable Electric Cleaning Brush",c:"Home & Daily Needs",p:899,o:1199,e:"🧹"},
{id:6,n:"USB Fast Charging Cable",c:"Tech & Gadgets",p:249,o:399,e:"🔌"},
{id:7,n:"Portable Tool Kit",c:"Tools & Equipment",p:999,o:1299,e:"🛠️"},
{id:8,n:"Baby Night Light",c:"Baby & Toys",p:449,o:599,e:"🌙"},
{id:9,n:"Multi-Purpose Storage Organizer",c:"Home & Daily Needs",p:699,o:899,e:"🗃️"},
{id:10,n:"Digital Tyre Pressure Gauge",c:"Car & Auto",p:549,o:749,e:"🛞"},
{id:11,n:"Smart Fitness Band",c:"Tech & Gadgets",p:1299,o:1699,e:"⌚"},
{id:12,n:"Stainless Steel Water Bottle",c:"Home & Daily Needs",p:399,o:549,e:"🥤"}
];
let cart=[], category="All";
const cats=["All","Car & Auto","Tech & Gadgets","Baby & Toys","Home & Daily Needs","Tools & Equipment"];
function renderCats(){document.getElementById("cats").innerHTML=cats.map(x=>`<button class="cat ${x===category?'active':''}" onclick="category='${x}';render()">${x}</button>`).join("")}
function render(){
 renderCats();
 const q=document.getElementById("search").value.toLowerCase();
 const list=products.filter(x=>(category==="All"||x.c===category)&&x.n.toLowerCase().includes(q));
 document.getElementById("grid").innerHTML=list.length?list.map(x=>`<div class="card"><div class="pic">${x.e}</div><div class="info"><div class="name">${x.n}</div><div class="price">₹${x.p.toLocaleString()} <span class="old">₹${x.o.toLocaleString()}</span></div><button class="add" onclick="add(${x.id})">Add to Cart</button></div></div>`).join(""):`<div class="empty" style="grid-column:1/-1">No products found.</div>`;
}
function add(id){cart.push(id);updateCount();toast("Added to cart")}
function updateCount(){document.getElementById("count").textContent=cart.length}
function openCart(){
 document.getElementById("modal").style.display="block";document.getElementById("checkout").style.display="none";
 document.getElementById("modalTitle").textContent="Your Cart";
 const grouped={};cart.forEach(id=>grouped[id]=(grouped[id]||0)+1);
 let total=0,items="";
 Object.entries(grouped).forEach(([id,qty])=>{let x=products.find(p=>p.id==id);total+=x.p*qty;items+=`<div class="row"><span>${x.e} ${x.n} × ${qty}</span><b>₹${(x.p*qty).toLocaleString()}</b></div>`});
 document.getElementById("cartItems").innerHTML=items||'<div class="empty">Your cart is empty.</div>';
 document.getElementById("cartActions").innerHTML=cart.length?`<div class="row"><b>Total</b><b>₹${total.toLocaleString()}</b></div><button class="pay" onclick="showCheckout()">Continue to Checkout</button>`:"";
}
function showCheckout(){document.getElementById("checkout").style.display="block";document.getElementById("cartActions").innerHTML=""}
function demoPayment(){
 if(!name.value||!phone.value||!address.value){alert("Please fill all delivery details.");return}
 alert("Demo only: payment gateway is not connected yet. Connect Razorpay/Stripe to accept real online payments.");
}
function closeModal(){document.getElementById("modal").style.display="none"}
function toast(t){let d=document.createElement("div");d.textContent=t;d.style="position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:11px 18px;border-radius:25px;z-index:50";document.body.appendChild(d);setTimeout(()=>d.remove(),1200)}
render();updateCount();
</script>
</body>
</html>
